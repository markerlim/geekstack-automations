name: Run Duel Masters Price Scraper (Full Ahead)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 18 * * *'  # enable once a manual run looks good

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Scrape fullahead-dm.com, match to DB, upload prices
      env:
        MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
        MONGO_USER: ${{ secrets.MONGO_USER }}
        MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        MONGO_CLUSTER: ${{ secrets.MONGO_CLUSTER }}
        C_DUELMASTERS: ${{ vars.C_DUELMASTERS }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python scrapers/duelmasters/scripts/match_fullahead.py --all --min-set 22
        python pricescraper/upload_normalised.py --only fau
